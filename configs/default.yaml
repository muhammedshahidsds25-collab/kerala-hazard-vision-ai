# Main configuration. Every number the code uses is set here; see src/kerala_hazard_vision_ai/config.py.

data:
  tile_size: 256          # pixels (2.56 km at 10 m)
  stride: 128             # 50% overlap: more training tiles from few events
  max_nodata_frac: 0.2    # drop tiles with more cloud-masked pixels than this
  dry_season_start_month: 12  # before/after composites use the clearest Kerala months:
  dry_season_end_month: 4     # Dec-Apr before the event and Dec-Apr after it (season-matched)
  max_cloud_pct: 40       # scene-level cloud filter before per-pixel masking
  scale_m: 10             # Sentinel-2 visible/NIR resolution
  crs: "EPSG:32643"       # UTM zone 43N covers all of Kerala
  check_scale_m: 100      # coarse scale for the quick cloud-free check
  min_valid_frac: 0.6     # drop an event if less of its area has a clear composite
  rain_days_before: 7     # CHIRPS accumulation window ending on the event day
  drive_folder: kerala_hazard_vision_ai
  test_event: pettimudi_2020

severity:
  ndvi_drop: 0.25         # landslide: vegetation loss that counts as changed
  water_ndwi: 0.0         # flood: pixel becomes water when NDWI crosses this (McFeeters)
  eps: 1.0e-6

model:
  in_channels: 9          # 4 before bands + slope + rain + soil + severity + hazard
  out_channels: 4         # B2, B3, B4, B8 after
  ngf: 64
  ndf: 64
  num_downs: 8            # 256 / 2**8 = 1 at the bottleneck

train:
  epochs: 100
  batch_size: 16
  lr: 2.0e-4
  beta1: 0.5
  beta2: 0.999
  l1_weight: 100.0
  seed: 42
  severe_threshold: 0.05  # tiles above this severity are oversampled
  val_frac: 0.1
  num_workers: 2          # Colab has 2 CPU cores
  checkpoint_dir: checkpoints

demo:
  kerala_bbox: [74.85, 8.17, 77.42, 12.80]
  max_demo_area_km2: 25.0
  sweep: [0.1, 0.3, 0.6, 1.0]
  train_severity_max: 1.0  # overwritten after the data step with the observed maximum

eval:
  rgb_max: 0.3            # reflectance mapped to white in RGB figures and image metrics
  # Stable Diffusion img2img comparison (pretrained, no fine-tuning). {hazard} is filled in.
  prompts:
    - "satellite image of the same area after a {hazard}"
    - "Sentinel-2 satellite photo, top-down view, after a {hazard}, same terrain and rivers"
    - "aerial view after a severe {hazard}, exposed brown soil, destroyed vegetation, debris"
    - "post-disaster satellite imagery, {hazard}, realistic, high detail"
  sd_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  sd_strength: 0.5        # how far SD may move away from the before image (0-1)
  sd_steps: 30
  sd_size: 512            # SD 1.5 native resolution; tiles are upscaled then resized back
  sd_batch_size: 8        # fits a 16 GB T4 in fp16

diffusion:                # Palette-style conditional DDPM, compared against pix2pix
  block_out_channels: [64, 128, 256, 256]
  layers_per_block: 2
  attention_levels: 2     # self-attention in the two lowest-resolution levels
  norm_num_groups: 32
  train_timesteps: 1000
  beta_schedule: squaredcos_cap_v2  # cosine noise schedule (Nichol & Dhariwal, 2021)
  sample_steps: 50        # DDIM steps at inference
  epochs: 200             # ~3-4 h on a T4 with mixed precision; resumable
  batch_size: 8
  lr: 1.0e-4
  ema_decay: 0.999        # evaluate an exponential moving average of the weights
  mixed_precision: true   # fp16 autocast on CUDA only
  checkpoint_dir: checkpoints_diffusion
