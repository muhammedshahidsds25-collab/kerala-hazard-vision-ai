[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disastergen"
version = "0.1.0"
description = "Conditional GAN that generates post-disaster Sentinel-2 imagery of Kerala."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammed Shahid S" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchmetrics[image]>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390", "geemap>=0.32", "rasterio>=1.3"]
diffusion = ["diffusers>=0.27", "transformers>=4.40", "accelerate>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D"]
